version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      # ESLint y sus complementos se actualizan siempre juntos: @eslint/js 10 exige eslint 10, y
      # subir solo uno rompe `npm ci` (ERESOLVE).
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "globals"]
      # Agrupa las actualizaciones menores y de parche para no recibir un PR por paquete.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
