version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    ignore:
      # Saltos mayores que hoy no se pueden aplicar (ver docs/CALIDAD.md, "Migraciones pendientes").
      # Las versiones menores y los parches de estos paquetes siguen llegando.
      - dependency-name: "typescript"       # ts-jest solo admite TypeScript < 7
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sentry/node"     # Sentry 11 elimina sendDefaultPii: requiere revisión de privacidad
        update-types: ["version-update:semver-major"]
      - dependency-name: "dotenv"           # dotenv 18 exige moduleResolution con soporte de "exports"
        update-types: ["version-update:semver-major"]
    groups:
      # ESLint y sus complementos se actualizan siempre juntos: @eslint/js 10 exige eslint 10, y
      # subir solo uno rompe `npm ci` (ERESOLVE).
      eslint:
        patterns: ["eslint", "@eslint/*", "typescript-eslint", "globals"]
      # Agrupa las actualizaciones menores y de parche para no recibir un PR por paquete.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
