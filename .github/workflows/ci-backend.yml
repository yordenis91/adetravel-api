name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Inspector de Backend
    runs-on: ubuntu-latest

    # Postgres real para las migraciones y para el test e2e de pagos
    # (__tests__/payments.e2e.test.ts), que hasta ahora nunca corría en CI.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: adetravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/adetravel_test?schema=public"
      JWT_SECRET: "ci-jwt-secret-not-for-real-use-0000000000"
      FRONTEND_URL: "http://localhost:8080"

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v7

      - name: ⚙️ Configurar Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🗄️ Generar Cliente Prisma
        run: npx prisma generate

      - name: 🗄️ Aplicar migraciones (Postgres de CI)
        run: npx prisma migrate deploy

      - name: 🔨 Construir TypeScript (comprueba tipos en modo estricto)
        run: npm run build

      # Línea base de 261 avisos heredados (245 son `any`): el CI falla si aparece uno nuevo.
      - name: 🔎 Lint (sin avisos nuevos)
        run: npm run lint:ci

      # Solo dependencias de producción; falla con severidad alta o crítica.
      - name: 🛡️ Auditoría de dependencias
        run: npm audit --omit=dev --audit-level=high

      - name: 🧪 Ejecutar tests con cobertura (todo src/, unitarias + e2e)
        run: npm test -- --coverage

      # La cobertura de todo src/ queda a la vista en el resumen de cada ejecución.
      - name: 📊 Publicar cobertura en el resumen
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          if (!fs.existsSync("coverage/coverage-summary.json")) process.exit(0);
          const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
          const row = (k, n) => `| ${n} | ${t[k].pct} % | ${t[k].covered} / ${t[k].total} |`;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, ["### Cobertura del API (todo src/)", "", "| Métrica | Cobertura | Cubierto |", "|---|---|---|", row("statements", "Sentencias"), row("branches", "Ramas"), row("functions", "Funciones"), row("lines", "Líneas"), ""].join("\n"));
          '

      # Solo dispara el deploy en un push real a main (mergeado), nunca en el
      # build de un Pull Request todavía sin mergear. El token vive en un
      # GitHub Secret, no en texto plano (ver README del repo / PR de rotación).
      - name: 🚀 Notificar a EasyPanel (despliegue Backend)
        if: github.event_name == 'push' && success()
        # Reintenta si el panel está reiniciándose o tarda en responder (GitHub no puede conectar
        # a veces justo después de otro despliegue). --fail hace visible un error HTTP del panel.
        run: |
          curl --fail --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 15 --retry-connrefused --retry-all-errors \
            -X POST "${{ secrets.EASYPANEL_BACKEND_DEPLOY_HOOK }}"
