name: Backend CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Inspector de Backend
    runs-on: ubuntu-latest

    # Postgres real para las migraciones y para el test e2e de pagos
    # (__tests__/payments.e2e.test.ts), que hasta ahora nunca corría en CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: adetravel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://test:test@localhost:5432/adetravel_test?schema=public"
      JWT_SECRET: "ci-jwt-secret-not-for-real-use-0000000000"
      FRONTEND_URL: "http://localhost:8080"

    steps:
      - name: 📥 Clonar el repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Instalar dependencias
        run: npm ci

      - name: 🗄️ Generar Cliente Prisma
        run: npx prisma generate

      - name: 🗄️ Aplicar migraciones (Postgres de CI)
        run: npx prisma migrate deploy

      - name: 🔨 Construir TypeScript
        run: npm run build

      - name: 🧪 Ejecutar tests con cobertura
        run: npm test -- --coverage

      # Solo dispara el deploy en un push real a main (mergeado), nunca en el
      # build de un Pull Request todavía sin mergear. El token vive en un
      # GitHub Secret, no en texto plano (ver README del repo / PR de rotación).
      - name: 🚀 Notificar a EasyPanel (despliegue Backend)
        if: github.event_name == 'push' && success()
        run: |
          curl -X POST "${{ secrets.EASYPANEL_BACKEND_DEPLOY_HOOK }}"
